<!doctype html>
<!--
  The profile picture for the project's X account: 1000x1000, shown as a circle.

  Not served by the site -- it is uploaded to X by hand -- but kept here so it
  can be remade when the copy or the palette moves, rather than redrawn from
  memory. Same Epilogue and Inter the pages load, same lime mark.

    cd web
    google-chrome --headless=new --disable-gpu --hide-scrollbars \
      --force-device-scale-factor=1 --virtual-time-budget=12000 \
      --window-size=1000,1000 --screenshot=$HOME/Desktop/kolo-x-profile.png \
      "file://$PWD/scripts/x-avatar.html"

  X crops to a circle, so the lime bleeds to all four edges and the mark
  stays well inside the inscribed square.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 1000px; height: 1000px; }
  /* Full-bleed lime, not the rounded tile the app icon uses: X crops a
     profile picture to a circle, and a rounded square inside a circle shows
     dark slivers at four corners. Bleeding the lime means the crop is clean
     whatever shape the client decides on. */
  body {
    background: #D2FF3A;
    display: flex; align-items: center; justify-content: center;
  }
  /* Two things the app icon gets away with and a profile picture does not.
     The art is not centred in its own 40x40 viewBox -- it spans y 5.9 to
     29.5, because the rounded tile used to sit behind it -- so the viewBox is
     retaken around the art itself, centred on (20, 17.7). And it is scaled up:
     at 48px in a timeline the mark has to carry the whole brand, and a circle
     inscribed in 1000px leaves a 707px safe square, so 640 fits with room. */
  svg { width: 640px; height: 640px; display: block; }
</style>
</head>
<body>
  <svg viewBox="7 4.7 26 26" fill="none">
    <circle cx="20" cy="9.5" r="3.6" fill="#0A0A0C"/>
    <rect x="11" y="17.5" width="18" height="3.2" rx="1.6" fill="#0A0A0C"/>
    <path d="M12 25.5c1.9 2.6 4.7 4 8 4s6.1-1.4 8-4" stroke="#0A0A0C" stroke-width="3" stroke-linecap="round"/>
  </svg>
</body>
</html>
