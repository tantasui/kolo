<!doctype html>
<!--
  The link-preview card: src/app/opengraph-image.png, which Next serves as
  og:image, and twitter-image.png beside it, which is the same picture.

  It is a committed PNG rather than a generated one. `next/og` would render it
  per request through Satori, which cannot use the woff this repo ships and
  reflows type differently from a browser; this is the same Epilogue and Inter
  the page itself loads, laid out by the same engine. To change it, edit this
  file and re-shoot:

    cd web
    google-chrome --headless=new --disable-gpu --hide-scrollbars \
      --force-device-scale-factor=1 --virtual-time-budget=12000 \
      --window-size=1200,630 --screenshot=src/app/opengraph-image.png \
      "file://$PWD/scripts/og-image.html"
    cp src/app/opengraph-image.png src/app/twitter-image.png

  1200x630 is the size Twitter, Slack, WhatsApp and iMessage all crop least.
  Keep the important things inside the 80px margin: some clients round the
  corners and a few crop to 2:1.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@600;700;800&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
  :root {
    --deep: #091C00;
    --deep-2: #163300;
    --spring: #ACF67C;
    --card: #FFFFFF;
    --deep-quiet: #B3BFAE;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--deep);
    font-family: Inter, sans-serif;
    color: var(--card);
    position: relative;
    overflow: hidden;
  }
  /* the same soft bloom the hero uses, so the card reads as the same place */
  .glow-a {
    position: absolute; width: 620px; height: 620px; border-radius: 50%;
    background: var(--spring); opacity: .13; filter: blur(130px);
    left: -180px; top: -260px;
  }
  .glow-b {
    position: absolute; width: 560px; height: 560px; border-radius: 50%;
    background: var(--spring); opacity: .10; filter: blur(140px);
    right: -170px; bottom: -240px;
  }
  .frame {
    position: relative; height: 100%;
    padding: 66px 80px 68px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand span {
    font-family: Epilogue, sans-serif; font-weight: 800;
    font-size: 40px; letter-spacing: -.03em;
  }
  h1 {
    font-family: Epilogue, sans-serif; font-weight: 800;
    font-size: 84px; line-height: 1.03; letter-spacing: -.036em;
    max-width: 16ch;
  }
  h1 em { font-style: normal; color: var(--spring); }
  p {
    margin-top: 30px; font-size: 29px; line-height: 1.45;
    color: var(--deep-quiet); max-width: 36ch; font-weight: 400;
  }
  .foot { display: flex; align-items: center; justify-content: space-between; }
  .url {
    font-family: Epilogue, sans-serif; font-weight: 700;
    font-size: 30px; color: var(--spring); letter-spacing: -.01em;
  }
  .chips { display: flex; gap: 12px; }
  .chip {
    border: 1px solid #2C4720; border-radius: 999px;
    padding: 11px 22px; font-size: 22px; font-weight: 500;
    color: #D7E4D0;
  }
</style>
</head>
<body>
  <div class="glow-a"></div>
  <div class="glow-b"></div>
  <div class="frame">
    <div class="brand">
      <svg width="56" height="56" viewBox="0 0 40 40" fill="none">
        <rect width="40" height="40" rx="12" fill="#D2FF3A"/>
        <circle cx="20" cy="9.5" r="3.6" fill="#0A0A0C"/>
        <rect x="11" y="17.5" width="18" height="3.2" rx="1.6" fill="#0A0A0C"/>
        <path d="M12 25.5c1.9 2.6 4.7 4 8 4s6.1-1.4 8-4" stroke="#0A0A0C" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <span>Kolo</span>
    </div>

    <div>
      <h1>Money that moves <em>like a message.</em></h1>
      <p>Send it to a name, not a number. It lands in seconds, and it never costs a thing.</p>
    </div>

    <div class="foot">
      <div class="url">usekolo.finance</div>
      <div class="chips">
        <div class="chip">Nothing to download</div>
        <div class="chip">Never a fee</div>
      </div>
    </div>
  </div>
</body>
</html>
